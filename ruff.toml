target-version = "py312"
line-length = 100
exclude = [
    ".venv",
    "venv",
    "tests/services/downloader_manager/_download_task.old",
    "sDownload/services/downloader_manager/old",
]

[lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade (e.g. Optional -> |, List -> list, Dict -> dict)
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
    "E501",  # line length (handled by formatter)
]

[lint.per-file-ignores]
"tests/*" = ["B018", "SIM117"]
