#======================================================================#
# Zones for rate‑ and connection‑limiting (must be in http context)
#======================================================================#
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;
limit_req_zone  $binary_remote_addr zone=req_limit:10m rate=1r/s;

#----------------------------------------------------------------------
# 1) HTTP server (port 80)
#----------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Default download
    location /default/ {
        alias /usr/share/nginx/html/files/;
        add_header X-Test-Scenario "default";
    }

    # Limited speed (100 KB/s)
    location /limited_speed/ {
        alias /usr/share/nginx/html/files/;
        limit_rate 100k;
        add_header X-Test-Scenario "limited_speed";
    }

    # Test speed (1 KB/s)
    location /limited_speed_2/ {
        alias /usr/share/nginx/html/files/;
        limit_rate 1k;
        add_header X-Test-Scenario "1kbs";
    }

    # Limit to 2 concurrent connections
    location /limited_conn/ {
        alias /usr/share/nginx/html/files/;
        limit_conn addr_limit 2;
        add_header X-Test-Scenario "limited_conn";
    }

    location /no_resume/ {
        alias /usr/share/nginx/html/files/;

        max_ranges 0;

        add_header Accept-Ranges none;
        add_header X-Test-Scenario "no_resume";
    }

    # Serve single file without filename in URL
    location = /no_filename {
        alias /usr/share/nginx/html/files/file_1M.bin;
        add_header X-Test-Scenario "no_filename";
    }

    # JSON endpoint (application/json)
    location = /json-data {
        max_ranges 0;
        default_type application/json;
        add_header X-Test-Scenario "json_data";
        alias  /usr/share/nginx/html/json/data.json;
    }

    # Extra: request rate‑limiting (burst of 2)
    location /rate_limit/ {
        alias /usr/share/nginx/html/files/;
        limit_req zone=req_limit burst=2 nodelay;
        add_header X-Test-Scenario "rate_limit";
    }
}

#----------------------------------------------------------------------
# 2) HTTPS server with valid self‑signed cert (port 443)
#----------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate      /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key  /etc/nginx/ssl/selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Reuse same locations over HTTPS
    location /default/       { alias /usr/share/nginx/html/files/; add_header X-Test-Scenario "default_https"; }
    location /limited_speed/ { alias /usr/share/nginx/html/files/; limit_rate 100k; add_header X-Test-Scenario "limited_speed_https"; }
    location /1kbs/          { alias /usr/share/nginx/html/files/; limit_rate 1k; add_header X-Test-Scenario "1kbs_https"; }
    location /limited_conn/  { alias /usr/share/nginx/html/files/; limit_conn addr_limit 2; add_header X-Test-Scenario "limited_conn_https"; }
    location /no_resume/     { alias /usr/share/nginx/html/files/; add_header Accept-Ranges none; add_header X-Test-Scenario "no_resume_https"; }
    location = /no_filename   { alias /usr/share/nginx/html/files/file_1M.bin; add_header X-Test-Scenario "no_filename_https"; }
    location = /json-data     { default_type application/json; alias /usr/share/nginx/html/json/data.json; add_header X-Test-Scenario "json_data_https"; }
}

#----------------------------------------------------------------------
# 3) HTTPS server with expired cert (port 8443)
#----------------------------------------------------------------------
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate      /etc/nginx/ssl/expired.crt;
    ssl_certificate_key  /etc/nginx/ssl/expired.key;

    # Expose one route to trigger cert error
    location /expired_cert/ {
        alias /usr/share/nginx/html/files/;
        add_header X-Test-Scenario "expired_cert";
    }
}

