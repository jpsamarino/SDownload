#======================================================================#
# Zones for rate‑ and connection‑limiting (must be in http context)
#======================================================================#
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;
limit_req_zone  $binary_remote_addr zone=req_limit:10m rate=1r/s;

#----------------------------------------------------------------------
# 1) HTTP server (port 80)
#----------------------------------------------------------------------
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    # Default download
    location /default/ {
        alias /usr/share/nginx/html/files/;
        add_header X-Test-Scenario "default";
    }

    # Limited speed (100 KB/s)
    location /limited_speed/ {
        alias /usr/share/nginx/html/files/;
        limit_rate 100k;
        add_header X-Test-Scenario "limited_speed";
    }

    # Test speed (1 KB/s)
    location /1KBps/ {
        alias /usr/share/nginx/html/files/;
        limit_rate 1k;
        add_header X-Test-Scenario "1KBps";
    }

    # Limit to 2 concurrent connections
    location /limited_conn/ {
        alias /usr/share/nginx/html/files/;
        limit_conn addr_limit 2;
        add_header X-Test-Scenario "limited_conn";
    }

    location /no_resume/ {
        alias /usr/share/nginx/html/files/;

        max_ranges 0;

        add_header Accept-Ranges none;
        add_header X-Test-Scenario "no_resume";
    }

    # Stream locations
    location /stream_chunked/ {
        alias /usr/share/nginx/html/files/;
        gzip on;
        gzip_min_length 0;
        gzip_types *;
        gzip_proxied any;
        chunked_transfer_encoding on;
        add_header X-Test-Scenario "stream_chunked";
    }

    location /stream_no_resume/ {
        alias /usr/share/nginx/html/files/;
        max_ranges 0;
        gzip on;
        gzip_min_length 0;
        gzip_types *;
        gzip_proxied any;
        chunked_transfer_encoding on;
        add_header Accept-Ranges none;
        add_header X-Test-Scenario "stream_no_resume";
    }

    location /stream_slow_1mb/ {
        alias /usr/share/nginx/html/files/;
        limit_rate 100k;
        gzip on;
        gzip_min_length 0;
        gzip_types *;
        gzip_proxied any;
        max_ranges 0;
        chunked_transfer_encoding on;
        add_header X-Test-Scenario "stream_slow_1mb";
    }

    location /stream_slow_10mb/ {
        alias /usr/share/nginx/html/files/;
        limit_rate 1m;
        gzip on;
        gzip_min_length 0;
        gzip_types *;
        gzip_proxied any;
        max_ranges 0;
        chunked_transfer_encoding on;
        add_header X-Test-Scenario "stream_slow_10mb";
    }

    # Serve single file without filename in URL
    location = /no_filename {
        alias /usr/share/nginx/html/files/file_1M.bin;
        add_header X-Test-Scenario "no_filename";
    }

    # JSON endpoint (application/json)
    location = /json-data {
        max_ranges 0;
        default_type application/json;
        add_header X-Test-Scenario "json_data";
        alias  /usr/share/nginx/html/json/data.json;
    }

    # Extra: request rate‑limiting (burst of 2)
    location /rate_limit/ {
        alias /usr/share/nginx/html/files/;
        limit_req zone=req_limit burst=2 nodelay;
        add_header X-Test-Scenario "rate_limit";
    }

    # Professional Test Entry Point requested by the user
    location /scenarios_pages_html {
        root /usr/share/nginx/html;
        index index.html;
        autoindex on;
        add_header X-Test-Scenario "scenarios_pages";
        try_files $uri $uri/ =404;
    }

    # Serve static CSS
    location /css/ {
        root /usr/share/nginx/html;
    }

    # Default index
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}

#----------------------------------------------------------------------
# 2) HTTPS server with valid self‑signed cert (port 443)
#----------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate      /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key  /etc/nginx/ssl/selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Reuse same locations over HTTPS
    location /default/          { alias /usr/share/nginx/html/files/; add_header X-Test-Scenario "default_https"; }
    location /limited_speed/    { alias /usr/share/nginx/html/files/; limit_rate 100k; add_header X-Test-Scenario "limited_speed_https"; }
    location /1KBps/            { alias /usr/share/nginx/html/files/; limit_rate 1k; add_header X-Test-Scenario "1KBps_https"; }
    location /limited_conn/     { alias /usr/share/nginx/html/files/; limit_conn addr_limit 2; add_header X-Test-Scenario "limited_conn_https"; }
    location /no_resume/        { alias /usr/share/nginx/html/files/; add_header Accept-Ranges none; add_header X-Test-Scenario "no_resume_https"; }
    location /stream_chunked/   { alias /usr/share/nginx/html/files/; gzip on; gzip_min_length 0; gzip_types *; gzip_proxied any; chunked_transfer_encoding on; add_header X-Test-Scenario "stream_chunked_https"; }
    location /stream_no_resume/ { alias /usr/share/nginx/html/files/; max_ranges 0; gzip on; gzip_min_length 0; gzip_types *; gzip_proxied any; chunked_transfer_encoding on; add_header Accept-Ranges none; add_header X-Test-Scenario "stream_no_resume_https"; }
    location /stream_slow_1mb/  { alias /usr/share/nginx/html/files/; limit_rate 100k; gzip on; gzip_min_length 0; gzip_types *; gzip_proxied any; max_ranges 0; chunked_transfer_encoding on; add_header X-Test-Scenario "stream_slow_1mb_https"; }
    location /stream_slow_10mb/ { alias /usr/share/nginx/html/files/; limit_rate 1m; gzip on; gzip_min_length 0; gzip_types *; gzip_proxied any; max_ranges 0; chunked_transfer_encoding on; add_header X-Test-Scenario "stream_slow_10mb_https"; }
    location = /no_filename     { alias /usr/share/nginx/html/files/file_1M.bin; add_header X-Test-Scenario "no_filename_https"; }
    location = /json-data       { default_type application/json; alias /usr/share/nginx/html/json/data.json; add_header X-Test-Scenario "json_data_https"; }
}

#----------------------------------------------------------------------
# 3) HTTPS server with expired cert (port 8443)
#----------------------------------------------------------------------
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate      /etc/nginx/ssl/expired.crt;
    ssl_certificate_key  /etc/nginx/ssl/expired.key;

    # Expose one route to trigger cert error
    location /expired_cert/ {
        alias /usr/share/nginx/html/files/;
        add_header X-Test-Scenario "expired_cert";
    }
}

